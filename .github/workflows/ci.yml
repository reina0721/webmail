name: Quick release and checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Serialize complete release runs across both main previews and version tags.
  group: ${{ (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release-preview]'))) && 'mail-web-quick-release' || format('validate-{0}', github.ref) }}
  cancel-in-progress: ${{ !(startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release-preview]'))) }}
jobs:
  cancel-superseded:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - name: Cancel older main runs before they can publish stale assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&per_page=100" --jq '.workflow_runs[] | select(.id < '${GITHUB_RUN_ID}' and (.status == "queued" or .status == "in_progress") and (.event == "push" or .event == "workflow_dispatch")) | .id' > /tmp/older-runs
          while read -r run; do
            gh run cancel "$run" --repo "$GITHUB_REPOSITORY" || true
          done < /tmp/older-runs
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Check coordinated versions before building
        env:
          IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release-preview]')) }}
        run: |
          set -eu
          version="$(cat release-version.txt)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="$GITHUB_REF_NAME"; fi
          python3 tooling/release_metadata.py check-version "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$IS_RELEASE" >> "$GITHUB_OUTPUT"
  preflight:
    if: needs.metadata.outputs.release == 'true'
    needs: metadata
    runs-on: ubuntu-24.04
    # Draft visibility requires push access; this job never runs for a PR.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check version ownership and stable acceptance before native builds
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            case "$VERSION" in v*-*) ;; *) echo 'Branch releases must be prereleases'; exit 1;; esac
          fi
          sh tooling/release-guard.sh "$VERSION"
          case "$VERSION" in
            *-*) echo 'Prerelease: production evidence is not promoted';;
            *) jq -e '.readyForPublicRegistration == true' docs/acceptance.json;;
          esac
  fast-check:
    name: Fast workspace checks
    needs: metadata
    if: ${{ !cancelled() && needs.metadata.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: corepack enable && corepack prepare pnpm@10.22.0 --activate
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Check repository, boundaries, and frontend types
        run: |
          set -eu
          python3 tooling/check-repository.py
          node frontend/tooling/check-boundaries.mjs
          node frontend/tooling/check-boundaries-fixtures.mjs
          node tooling/check-persistence.mjs
          node tooling/check-upstream.mjs
          pnpm --dir frontend typecheck
      - name: Install Rust lint components
        run: rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fast-check
          cache-on-failure: 'true'
      - name: Check workspace formatting, Linux CLI build, Clippy, and OpenAPI contract
        run: |
          set -eu
          cargo fmt --all -- --check
          cargo check --locked --workspace --all-targets
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo run --locked -p mail-web -- --openapi > /tmp/openapi.json
          diff -u backend/contract/openapi.json /tmp/openapi.json
          pnpm --dir frontend exec openapi-typescript ../backend/contract/openapi.json -o /tmp/generated-api.ts
          diff -u frontend/apps/web/src/platform/lib/generated-api.ts /tmp/generated-api.ts
  checks:
    name: Build release (${{ matrix.architecture }})
    needs: metadata
    if: ${{ !cancelled() && needs.metadata.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Compute third-party dependency cache key
        id: deps
        run: |
          set -eu
          hash=$(python3 -c "import hashlib, pathlib; lock=pathlib.Path('Cargo.lock').read_text(); pkgs=[b for b in lock.split('\n[[package]]') if 'source = ' in b]; print(hashlib.sha256(('\n'.join(pkgs)+pathlib.Path('Cargo.toml').read_text()).encode()).hexdigest()[:16])")
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: rustcache
        with:
          path: ${{ runner.temp }}/rustcache
          key: rust-deps-${{ matrix.architecture }}-${{ steps.deps.outputs.hash }}
          restore-keys: |
            rust-deps-${{ matrix.architecture }}-
      - name: Prepare external Rust dependency cache and parallel compression tool
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          CACHE_HIT: ${{ steps.rustcache.outputs.cache-hit }}
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/rustcache" "$RUNNER_TEMP/cli-out"
          if ! command -v pigz >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends pigz
          fi
          if [ "$CACHE_HIT" != "true" ]; then
            docker buildx build --platform "linux/$ARCHITECTURE" --target rust-cache-export \
              --output "type=local,dest=$RUNNER_TEMP/rustcache" \
              --build-context "rustcache=$RUNNER_TEMP/rustcache" .
          fi
      - name: Build native application and CLI in parallel
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -eu
          docker buildx build --platform "linux/$ARCHITECTURE" --load \
            --build-arg MAIL_WEB_REVISION="$GITHUB_SHA" \
            --build-arg MAIL_WEB_SKIP_NEXT_TYPECHECK=1 \
            --build-context "rustcache=$RUNNER_TEMP/rustcache" \
            --cache-from "type=gha,scope=app-$ARCHITECTURE" \
            --cache-to "type=gha,scope=app-$ARCHITECTURE,mode=max" \
            -t mail-web:ci . &
          pid_app=$!
          docker buildx build --platform "linux/$ARCHITECTURE" \
            --target cli-artifact \
            --output "type=local,dest=$RUNNER_TEMP/cli-out" \
            --build-context "rustcache=$RUNNER_TEMP/rustcache" \
            --cache-from "type=gha,scope=cli-$ARCHITECTURE" \
            --cache-to "type=gha,scope=cli-$ARCHITECTURE,mode=max" \
            . &
          pid_cli=$!
          wait "$pid_app"
          wait "$pid_cli"
      - run: docker run --rm --pull never mail-web:ci --runtime-info
      - name: Package verified native release
        if: needs.metadata.outputs.release == 'true'
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          ARCHITECTURE: ${{ matrix.architecture }}
          MAIL_WEB_CLI_BIN: ${{ runner.temp }}/cli-out/mailwebctl
        run: |
          docker tag mail-web:ci "mail-web:${VERSION#v}"
          sh tooling/package-release.sh "$VERSION" "$ARCHITECTURE"
      - uses: actions/upload-artifact@v4
        if: needs.metadata.outputs.release == 'true'
        with:
          name: release-${{ matrix.architecture }}
          path: build/release/${{ needs.metadata.outputs.version }}/${{ matrix.architecture }}/*
          if-no-files-found: error
          compression-level: 0
  draft:
    if: needs.metadata.outputs.release == 'true'
    needs: [metadata, preflight, fast-check, checks]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: build/release-inputs
      - name: Assemble and checksum both architectures
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          python3 tooling/release_metadata.py assemble "$VERSION" --inputs build/release-inputs --output build/release-assets
          (cd build/release-assets && sha256sum -c SHA256SUMS)
      - name: Create or refresh same-commit draft
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -eu
          state=$(sh tooling/release-guard.sh "$VERSION")
          if [ "$state" = new ]; then
            case "$VERSION" in *-*) preview=--prerelease;; *) preview=;; esac
            gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --draft $preview --target "$GITHUB_SHA" --title "Mail Web $VERSION" --notes-file docs/release-notes.md
          else
            gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" --notes-file docs/release-notes.md
          fi
          gh release upload "$VERSION" build/release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
  publish:
    needs: [metadata, draft]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Prepare immutable publication record
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          mkdir -p build/published
          jq -n --arg version "$VERSION" --arg commit "$GITHUB_SHA" --arg repository "$GITHUB_REPOSITORY" '{version:$version,sourceCommit:$commit,repository:$repository}' > build/published/release-record.json
      - uses: actions/upload-artifact@v4
        with:
          name: published-release
          path: build/published/release-record.json
          if-no-files-found: error
          overwrite: true
          retention-days: 90
      - name: Publish after native builds, manifests and checksums pass
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -eu
          test "$(sh tooling/release-guard.sh "$VERSION")" = existing
          python3 tooling/release_status.py --publish --repository "$GITHUB_REPOSITORY" --version "$VERSION" --commit "$GITHUB_SHA" --phase fast --status success --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
